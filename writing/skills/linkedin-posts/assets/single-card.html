<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Post card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* One 1200×1500 card: brand, one headline, the product, three facts, the address.
     Replace the TEXT placeholders, the logo and the screenshot; set lang/dir for English (en, ltr). */
  :root {
    --bg: #f3f6f4;
    --surface: #ffffff;
    --border: #e3e8e5;
    --ink: #142019;
    --muted: #56625b;
    --primary: #317455;
    --glow: #dcefe4;
    --font: "IBM Plex Sans Arabic", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: var(--font); color: var(--ink); }
  .card {
    width: 1200px; height: 1500px; position: relative; overflow: hidden;
    padding: 96px 88px 80px; display: flex; flex-direction: column; gap: 40px;
    background: radial-gradient(900px 520px at 0% 0%, var(--glow) 0%, transparent 70%), var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 32px; }
  .brand img { width: 60px; height: 60px; }
  .brand span { color: var(--muted); font-weight: 500; font-size: 26px; margin-inline-start: auto; }
  h1 { margin: 0; font-size: 92px; line-height: 1.12; letter-spacing: -0.01em; font-weight: 700; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--primary); }
  .shot { border-radius: 30px; border: 2px solid var(--border); background: var(--surface); padding: 14px;
    box-shadow: 0 40px 80px -40px rgba(20, 40, 30, 0.45); height: 620px; overflow: hidden; }
  .shot img { display: block; width: 100%; border-radius: 18px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: auto; }
  .fact { background: var(--surface); border: 2px solid var(--border); border-radius: 24px; padding: 26px 28px;
    display: flex; flex-direction: column; gap: 6px; }
  .fact b { font-size: 34px; }
  .fact small { font-size: 24px; color: var(--muted); line-height: 1.4; }
  .url { display: flex; align-items: center; justify-content: space-between; background: var(--primary); color: #fff;
    border-radius: 26px; padding: 30px 40px; font-size: 40px; font-weight: 700; }
  .url small { font-size: 26px; font-weight: 500; opacity: 0.85; }
</style>
</head>
<body>
<section class="card" id="card">
  <div class="brand"><img src="logo.svg" alt="">PRODUCT NAME<span>مجاني · مفتوح المصدر</span></div>
  <h1>HEADLINE START <em>HIGHLIGHTED END.</em></h1>
  <div class="shot"><img src="screenshot.png" alt=""></div>
  <div class="facts">
    <div class="fact"><b>FACT 1</b><small>one short line</small></div>
    <div class="fact"><b>FACT 2</b><small>one short line</small></div>
    <div class="fact"><b>FACT 3</b><small>one short line</small></div>
  </div>
  <div class="url">example.com <small>الموقع وطريقة التثبيت ←</small></div>
</section>
</body>
</html>
